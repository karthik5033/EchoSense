services:
  postgres:
    image: postgres:16-alpine
    container_name: echosense_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-echosense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echosense_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-echosensedb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-echosense} -d ${POSTGRES_DB:-echosensedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: echosense_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echosense_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-echosense}:${POSTGRES_PASSWORD:-echosense_dev_secret}@postgres:5432/${POSTGRES_DB:-echosensedb}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-echosense-super-secure-production-secret-key-340ms-lead-time}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: echosense_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
